<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Immortility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #06040a;
      --bg-deep: #030108;
      --grid: rgba(255, 48, 62, 0.09);
      --wire: #ff2f42;
      --wire-dim: #7a101c;
      --wire-hot: #ff7a85;
      --skin-glow: rgba(255, 70, 85, 0.14);
      --panel: rgba(10, 3, 8, 0.94);
      --line: rgba(255, 55, 70, 0.28);
      --text: #ffe8ea;
      --muted: #9a6a72;
      --user-bubble: linear-gradient(145deg, rgba(255, 45, 60, 0.22), rgba(80, 10, 20, 0.35));
      --bot-bubble: rgba(22, 8, 12, 0.92);
      --font-display: "Oxanium", "Bahnschrift", sans-serif;
      --font-body: "Sora", "Segoe UI", sans-serif;
      --font-mono: "Oxanium", "Cascadia Mono", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text);
      font-family: var(--font-body);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(300px, 44%) 1fr;
      width: 100vw;
      height: 100vh;
      max-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 55% 70% at 20% 48%, rgba(110, 12, 28, 0.5), transparent 62%),
        radial-gradient(ellipse 40% 50% at 85% 20%, rgba(40, 5, 15, 0.4), transparent 55%),
        var(--bg-deep);
    }

    .stage {
      position: relative;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--line);
      background-image:
        radial-gradient(circle at 50% 40%, rgba(255, 40, 60, 0.18), transparent 52%),
        radial-gradient(circle at 50% 70%, rgba(20, 0, 5, 0.55), transparent 55%),
        linear-gradient(rgba(255, 48, 62, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 48, 62, 0.05) 1px, transparent 1px);
      background-size: auto, auto, 32px 32px, 32px 32px;
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(255, 180, 160, 0.025) 50%,
        transparent 100%
      );
      background-size: 100% 8px;
      animation: scanSweep 7s linear infinite;
      pointer-events: none;
      opacity: 0.4;
    }
    @keyframes scanSweep {
      0% { background-position: 0 -40%; }
      100% { background-position: 0 140%; }
    }

    .brand-top {
      position: absolute;
      top: 22px;
      z-index: 2;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.52em;
      color: var(--wire-hot);
      text-shadow: 0 0 14px rgba(255, 80, 90, 0.35);
    }

    .face-wrap {
      position: relative;
      width: min(78%, 340px);
      aspect-ratio: 5 / 6;
      display: grid;
      place-items: center;
      z-index: 1;
      overflow: hidden;
    }
    .face-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(255, 70, 70, 0.28),
        transparent
      );
      animation: scanner 4s linear infinite;
      pointer-events: none;
      z-index: 3;
      mix-blend-mode: screen;
    }
    @keyframes scanner {
      from { transform: translateY(-100%); }
      to { transform: translateY(100%); }
    }

    .face-aura {
      position: absolute;
      inset: 6% 10%;
      border-radius: 48% 48% 44% 44%;
      background: radial-gradient(circle, rgba(255, 40, 60, 0.55), transparent 65%);
      filter: blur(45px);
      animation: auraPulse 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes auraPulse {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .face-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 22px rgba(255, 40, 60, 0.35));
      z-index: 2;
      position: relative;
    }

    .face-rig {
      transform-origin: 150px 190px;
      animation: breathe 4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-3px) scale(1.01) rotate(0.4deg); }
    }
    .face-wrap.is-speaking .face-rig {
      animation: breatheSpeak 3.2s ease-in-out infinite;
    }
    @keyframes breatheSpeak {
      0%, 100% { transform: translateY(0) scale(1) rotate(-0.6deg); }
      50% { transform: translateY(-4px) scale(1.015) rotate(0.8deg); }
    }
    .face-wrap.is-listening .face-rig {
      animation: breatheListen 2.4s ease-in-out infinite;
    }
    @keyframes breatheListen {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-2px) scale(1.012) rotate(-0.5deg); }
    }

    .skin-base { fill: url(#skinBase); }
    .skin-metal { fill: url(#skinHighlight); opacity: 0.22; }
    .skin-edge {
      fill: none;
      stroke: rgba(255, 50, 70, 0.45);
      stroke-width: 1.1;
      filter: url(#redGlow);
    }
    .feature {
      fill: none;
      stroke: rgba(255, 70, 90, 0.35);
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brow {
      fill: none;
      stroke: #ff5a6a;
      stroke-width: 2.1;
      stroke-linecap: round;
      filter: url(#redGlow);
      transition: transform 0.2s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .face-wrap.is-speaking .brow {
      transform: translateY(-3px);
    }
    .face-wrap.is-thinking .brow {
      transform: translateY(-1.5px) rotate(-2deg);
    }
    .face-wrap.is-thinking #browR {
      transform: translateY(-1.5px) rotate(2deg);
    }

    .lip {
      fill: none;
      stroke: rgba(255, 80, 100, 0.75);
      stroke-width: 1.7;
      stroke-linecap: round;
      filter: url(#redGlow);
    }
    .lip-fill {
      fill: rgba(255, 40, 60, 0.45);
      stroke: rgba(255, 90, 110, 0.7);
      stroke-width: 1;
    }

    .sclera {
      fill: #f2f2f2;
      stroke: rgba(255, 60, 80, 0.25);
      stroke-width: 0.7;
    }
    .iris {
      fill: url(#eyeGlow);
      filter: url(#redGlow);
      transform-box: fill-box;
      transform-origin: center;
      animation: eyePulse 2.5s ease-in-out infinite;
    }
    @keyframes eyePulse {
      0%, 100% { transform: scale(1); filter: url(#redGlow) brightness(1); }
      50% { transform: scale(1.08); filter: url(#redGlow) brightness(1.55); }
    }
    .pupil { fill: #050000; }
    .eye-shine { fill: rgba(255, 255, 255, 0.95); }
    .eye-shine-soft { fill: #ffdede; }
    .lid {
      fill: #0a0104;
      opacity: 0;
      pointer-events: none;
    }
    .iris-group {
      transition: transform 0.08s linear;
    }

    .circuits {
      stroke: #ff3244;
      stroke-width: 1.15;
      fill: none;
      opacity: 0.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#redGlow);
    }
    .circuits path {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: flow 3.2s linear infinite;
    }
    .circuits path:nth-child(2) { animation-delay: 0.4s; }
    .circuits path:nth-child(3) { animation-delay: 0.8s; }
    .circuits path:nth-child(4) { animation-delay: 1.1s; }
    .circuits .node {
      fill: #ff6675;
      stroke: none;
      filter: url(#strongGlow);
      animation: nodePulse 2.2s ease-in-out infinite;
    }
    @keyframes flow {
      to { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }

    .face-wrap.is-listening .face-aura {
      animation: auraPulse 1.2s ease-in-out infinite;
    }

    .face-wrap.is-speaking .mouth-idle { opacity: 0; }
    .face-wrap.is-speaking .mouth-talk {
      opacity: 1;
      transform-origin: 150px 232px;
      animation: speak 0.18s ease-in-out infinite;
    }
    .mouth-talk { opacity: 0; }
    .mouth-idle { opacity: 1; transition: opacity 0.12s; }
    @keyframes speak {
      0% { transform: scaleY(0.8); }
      20% { transform: scaleY(1.2); }
      40% { transform: scaleY(0.6); }
      60% { transform: scaleY(1.3); }
      80% { transform: scaleY(0.9); }
      100% { transform: scaleY(0.8); }
    }

    .face-wrap.is-thinking .iris-group {
      animation: thinking 1.5s linear infinite !important;
    }
    @keyframes thinking {
      0% { transform: translate(-2px, 0); }
      25% { transform: translate(2px, -2px); }
      50% { transform: translate(2px, 2px); }
      75% { transform: translate(-2px, 2px); }
      100% { transform: translate(-2px, 0); }
    }

    .listen-ring {
      position: absolute;
      inset: -2%;
      border: 1px solid rgba(255, 50, 70, 0.35);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .face-wrap.is-listening .listen-ring {
      opacity: 1;
      animation: ripple 1.5s ease-out infinite;
    }
    .listen-ring.d2 { animation-delay: 0.5s; }
    @keyframes ripple {
      0% { transform: scale(0.9); opacity: 0.55; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    .face-status {
      position: absolute;
      bottom: 22px;
      z-index: 2;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.32em;
      color: var(--muted);
    }
    .face-status .live {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--wire-dim);
      vertical-align: middle;
    }
    body[data-face="listening"] .face-status .live,
    body[data-face="speaking"] .face-status .live,
    body[data-face="thinking"] .face-status .live {
      background: var(--wire-hot);
      box-shadow: 0 0 10px var(--wire);
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }

    .chat {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(30, 6, 12, 0.5), transparent 120px),
        var(--panel);
      backdrop-filter: blur(8px);
    }

    .chat-header {
      flex-shrink: 0;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .chat-header h1 {
      font-family: var(--font-display);
      font-size: 15px;
      letter-spacing: 0.32em;
      color: var(--wire-hot);
      font-weight: 700;
    }
    .chat-header span {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .messages {
      flex: 1 1 auto;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255, 42, 58, 0.4);
      border-radius: 4px;
    }

    .bubble {
      max-width: 90%;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 2px 14px 14px 14px;
      font-size: 14.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      animation: bubbleIn 0.28s ease-out;
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-color: rgba(255, 90, 100, 0.4);
      border-radius: 14px 2px 14px 14px;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: var(--bot-bubble);
    }
    .bubble .who {
      display: block;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .chat-footer {
      flex-shrink: 0;
      border-top: 1px solid var(--line);
      background: rgba(8, 2, 6, 0.96);
      z-index: 2;
    }

    .typing {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--muted);
      display: none;
      padding: 10px 18px 0;
    }
    .typing.show { display: block; }

    .composer {
      padding: 12px 16px 18px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 110px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      font-family: var(--font-body);
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .composer textarea:focus {
      border-color: var(--wire);
      box-shadow: 0 0 0 1px rgba(255, 42, 58, 0.2), 0 0 20px rgba(255, 42, 58, 0.15);
    }
    .composer button {
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 0.16em;
      padding: 14px 18px;
      background: transparent;
      border: 1px solid var(--wire);
      border-radius: 10px;
      color: var(--wire-hot);
      cursor: pointer;
      text-shadow: 0 0 8px rgba(255, 42, 58, 0.4);
      flex-shrink: 0;
      transition: background 0.15s, transform 0.15s;
    }
    .composer button:hover:not(:disabled) {
      background: rgba(255, 42, 58, 0.18);
      transform: translateY(-1px);
    }
    .composer button:disabled {
      opacity: 0.4;
      cursor: wait;
    }
    .mic-btn {
      width: 50px;
      height: 50px;
      padding: 0 !important;
      display: grid;
      place-items: center;
      border-radius: 12px !important;
    }
    .mic-btn svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: var(--wire-hot);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mic-btn.is-listening {
      background: rgba(255, 42, 58, 0.25);
      box-shadow: 0 0 20px rgba(255, 42, 58, 0.5);
      animation: micPulse 1s ease-in-out infinite;
    }
    .mic-btn.is-listening svg { stroke: #fff; }
    @keyframes micPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(255, 42, 58, 0.35); }
      50% { box-shadow: 0 0 24px rgba(255, 42, 58, 0.8); }
    }
    .confirm-bar {
      display: none;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      background: rgba(255, 42, 58, 0.1);
    }
    .confirm-bar.show { display: flex; flex-wrap: wrap; }
    .confirm-bar p {
      flex: 1 1 100%;
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--muted);
      white-space: pre-wrap;
      max-height: 72px;
      overflow: auto;
    }
    .confirm-bar button {
      min-width: 88px;
      font-family: var(--font-display);
      letter-spacing: 0.12em;
      font-size: 11px;
      padding: 10px 14px;
      border: 1px solid var(--wire);
      border-radius: 8px;
      background: transparent;
      color: var(--wire-hot);
      cursor: pointer;
    }
    .confirm-bar button.yes {
      background: rgba(255, 42, 58, 0.25);
      color: #fff;
    }
    .confirm-bar button:disabled { opacity: 0.5; cursor: wait; }

    .boot {
      position: fixed;
      inset: 0;
      background: #000;
      display: grid;
      place-items: center;
      z-index: 50;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    .boot.hide { opacity: 0; visibility: hidden; }
    .boot span {
      font-family: var(--font-display);
      letter-spacing: 0.48em;
      color: var(--wire);
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 0 22px rgba(255, 42, 58, 0.7);
      animation: bootPulse 1.2s ease-in-out infinite;
    }
    @keyframes bootPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    @media (max-width: 720px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(160px, 36%) minmax(0, 1fr);
      }
      .stage { border-right: none; border-bottom: 1px solid var(--line); }
      .face-wrap { width: min(42%, 180px); }
    }
  </style>
</head>
<body data-face="idle">
  <div class="boot" id="boot"><span>IMMORTILITY</span></div>

  <div class="shell">
    <section class="stage">
      <div class="brand-top">IMMORTILITY</div>
      <div class="face-wrap is-idle" id="core">
        <div class="face-aura" aria-hidden="true"></div>
        <div class="listen-ring"></div>
        <div class="listen-ring d2"></div>
        <svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg" aria-label="Immortility face">
          <defs>
            <radialGradient id="skinBase" cx="50%" cy="28%" r="75%">
              <stop offset="0%" stop-color="#3d0a10"/>
              <stop offset="35%" stop-color="#190306"/>
              <stop offset="75%" stop-color="#090104"/>
              <stop offset="100%" stop-color="#000000"/>
            </radialGradient>
            <radialGradient id="skinHighlight" cx="62%" cy="22%" r="55%">
              <stop offset="0%" stop-color="#ff4d5f"/>
              <stop offset="40%" stop-color="#8a101f"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <radialGradient id="cheekGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ff2a3c" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <radialGradient id="eyeGlow" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ff6675"/>
              <stop offset="55%" stop-color="#aa1020"/>
              <stop offset="100%" stop-color="#55000b"/>
            </radialGradient>
            <linearGradient id="jawShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff3244" stop-opacity="0"/>
              <stop offset="100%" stop-color="#ff3244" stop-opacity="0.18"/>
            </linearGradient>
            <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="3.5" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="7" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <clipPath id="faceClip">
              <path d="M150 48 C110 50 72 86 63 145 C58 180 63 232 84 270 C98 298 120 320 150 328 C180 320 202 298 216 270 C237 232 242 180 237 145 C228 86 190 50 150 48 Z"/>
            </clipPath>
          </defs>

          <g class="face-rig" id="faceRig">
            <path class="skin-base" d="M150 48 C110 50 72 86 63 145 C58 180 63 232 84 270 C98 298 120 320 150 328 C180 320 202 298 216 270 C237 232 242 180 237 145 C228 86 190 50 150 48 Z"/>
            <path class="skin-metal" d="M150 48 C190 58 225 112 214 182 C205 248 184 292 150 325 C176 288 184 232 178 160 C172 98 162 70 150 48 Z"/>
            <path fill="url(#jawShade)" opacity="0.7" d="M84 270 C98 298 120 320 150 328 C180 320 202 298 216 270 C200 292 175 308 150 312 C125 308 100 292 84 270 Z"/>
            <path class="skin-edge" d="M150 48 C110 50 72 86 63 145 C58 180 63 232 84 270 C98 298 120 320 150 328 C180 320 202 298 216 270 C237 232 242 180 237 145 C228 86 190 50 150 48 Z"/>

            <g class="circuits" clip-path="url(#faceClip)">
              <path d="M118 120 L95 140 L110 168"/>
              <path d="M182 120 L205 142 L190 170"/>
              <path d="M140 235 L124 262"/>
              <path d="M160 235 L176 262"/>
              <path d="M150 100 L150 130 L138 155"/>
              <path d="M150 200 L150 225"/>
              <circle class="node" cx="95" cy="140" r="2.2"/>
              <circle class="node" cx="205" cy="142" r="2.2"/>
              <circle class="node" cx="110" cy="168" r="1.6"/>
              <circle class="node" cx="190" cy="170" r="1.6"/>
              <circle class="node" cx="124" cy="262" r="1.8"/>
              <circle class="node" cx="176" cy="262" r="1.8"/>
              <circle class="node" cx="150" cy="130" r="1.5"/>
            </g>

            <ellipse cx="96" cy="198" rx="16" ry="10" fill="url(#cheekGlow)"/>
            <ellipse cx="204" cy="198" rx="16" ry="10" fill="url(#cheekGlow)"/>

            <path class="brow" id="browL" d="M90 122 C 104 112 122 110 136 118"/>
            <path class="brow" id="browR" d="M164 118 C 178 110 196 112 210 122"/>

            <path class="feature" d="M150 152 C 148 168 147 180 150 190"/>
            <path class="feature" d="M143 190 C 148 194 152 194 157 190"/>

            <g id="eyeL">
              <ellipse class="sclera" cx="112" cy="145" rx="19" ry="10"/>
              <g class="iris-group" id="irisL">
                <circle class="iris" cx="112" cy="145" r="8"/>
                <circle class="pupil" cx="112" cy="145" r="3.1"/>
                <circle class="eye-shine" cx="109" cy="142" r="2"/>
                <circle class="eye-shine-soft" cx="114" cy="147" r="0.8"/>
              </g>
              <ellipse class="lid" id="lidL" cx="112" cy="145" rx="20" ry="1"/>
            </g>
            <g id="eyeR">
              <ellipse class="sclera" cx="188" cy="145" rx="19" ry="10"/>
              <g class="iris-group" id="irisR">
                <circle class="iris" cx="188" cy="145" r="8"/>
                <circle class="pupil" cx="188" cy="145" r="3.1"/>
                <circle class="eye-shine" cx="185" cy="142" r="2"/>
                <circle class="eye-shine-soft" cx="190" cy="147" r="0.8"/>
              </g>
              <ellipse class="lid" id="lidR" cx="188" cy="145" rx="20" ry="1"/>
            </g>

            <path class="lip mouth-idle" id="mouthIdle"
              d="M124 232 C 140 244 160 244 176 232"/>
            <path class="lip lip-fill mouth-talk" id="mouthTalk"
              d="M126 228 C 142 228 158 228 174 228
                 C 170 242 160 250 150 250
                 C 140 250 130 242 126 228 Z"/>
          </g>
        </svg>
      </div>
      <div class="face-status"><span class="live"></span><span id="syncLabel">SYNCED</span></div>
    </section>

    <section class="chat">
      <header class="chat-header">
        <h1>CHAT</h1>
        <span id="backendHint">AGENT // READY</span>
      </header>
      <div class="messages" id="messages"></div>
      <div class="chat-footer">
        <div class="typing" id="typing">IMMORTILITY IS WORKING…</div>
        <div class="confirm-bar" id="confirmBar">
          <p id="confirmText">Confirm this action?</p>
          <button type="button" class="yes" id="confirmYes">YES</button>
          <button type="button" id="confirmNo">NO</button>
        </div>
        <form class="composer" id="composer">
          <button type="button" class="mic-btn" id="micBtn" title="Voice chat — tap to start/stop conversation" aria-label="Voice conversation">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/>
              <path d="M5 11a7 7 0 0 0 14 0"/>
              <path d="M12 18v3"/>
            </svg>
          </button>
          <textarea id="input" rows="2" placeholder="Ask Immortility — open sites, files, code…" autocomplete="off"></textarea>
          <button type="submit" id="sendBtn">SEND</button>
        </form>
      </div>
    </section>
  </div>

  <script>
    const core = document.getElementById("core");
    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const typing = document.getElementById("typing");
    const composer = document.getElementById("composer");
    const confirmBar = document.getElementById("confirmBar");
    const confirmText = document.getElementById("confirmText");
    const confirmYes = document.getElementById("confirmYes");
    const confirmNo = document.getElementById("confirmNo");
    const backendHint = document.getElementById("backendHint");
    let faceMode = "idle";
    let talkAnim = null;
    let busy = false;
    let listening = false;
    let voiceConvo = false;
    let voiceSession = 0;       // increments on each start/stop — stale turns ignored
    let voiceLoopRunning = false;
    let voiceAbort = null;      // AbortController for in-flight fetch
    let awaitingConfirm = false;

    function hudHeaders(extra = {}) {
      const token = window.HUD_TOKEN || "";
      return {
        "Content-Type": "application/json",
        "X-Immortility-Token": token,
        ...extra,
      };
    }

    function showConfirm(prompt) {
      awaitingConfirm = true;
      confirmText.textContent = prompt || "Confirm this action? (yes / no)";
      confirmBar.classList.add("show");
      backendHint.textContent = "AWAITING CONFIRM // TERMINAL";
    }

    function hideConfirm() {
      awaitingConfirm = false;
      confirmBar.classList.remove("show");
      backendHint.textContent = "AGENT // READY";
    }

    async function decideConfirm(decision) {
      if (!awaitingConfirm) return;
      confirmYes.disabled = true;
      confirmNo.disabled = true;
      typing.textContent = decision === "yes" ? "RUNNING APPROVED ACTION…" : "CANCELLING…";
      typing.classList.add("show");
      try {
        const res = await fetch("/hud/confirm", {
          method: "POST",
          headers: hudHeaders(),
          body: JSON.stringify({ decision, speak: true }),
        });
        const data = await res.json();
        hideConfirm();
        addBubble("user", decision === "yes" ? "yes" : "no");
        addBubble("assistant", data.reply || data.error || "Done.");
        if (data.needs_confirm) showConfirm(data.confirm_prompt || data.reply);
      } catch (_) {
        addBubble("assistant", "Confirm failed — check the Immortility terminal.");
        hideConfirm();
      } finally {
        confirmYes.disabled = false;
        confirmNo.disabled = false;
        typing.classList.remove("show");
      }
    }

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = "bubble " + (role === "user" ? "user" : "assistant");
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "user" ? "REYANSH" : "IMMORTILITY";
      div.appendChild(who);
      div.appendChild(document.createTextNode(text));
      messagesEl.appendChild(div);
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    const irisGroups = () => document.querySelectorAll(".iris-group");

    function setFaceMode(mode) {
      mode = (mode || "idle").toLowerCase();
      if (mode === faceMode) {
        if (mode === "speaking") ensureTalkAnim();
        return;
      }
      faceMode = mode;
      document.body.dataset.face = mode;
      core.classList.remove("is-idle", "is-listening", "is-speaking", "is-thinking");
      if (mode === "listening") core.classList.add("is-listening");
      else if (mode === "speaking") core.classList.add("is-speaking");
      else if (mode === "thinking") core.classList.add("is-thinking");
      else core.classList.add("is-idle");
      // Clear inline gaze so CSS thinking / idle can take over
      irisGroups().forEach((eye) => { eye.style.transform = ""; });
      if (mode === "speaking") ensureTalkAnim();
      else stopTalkAnim();
    }

    // CSS handles mouth scaleY while speaking — keep stubs for callers
    function ensureTalkAnim() { /* CSS .is-speaking .mouth-talk */ }
    function stopTalkAnim() { talkAnim = null; }

    function blinkOnce() {
      const lids = [document.getElementById("lidL"), document.getElementById("lidR")];
      lids.forEach((lid) => {
        if (!lid) return;
        lid.setAttribute("ry", "11");
        lid.style.opacity = "1";
      });
      setTimeout(() => {
        lids.forEach((lid) => {
          if (!lid) return;
          lid.setAttribute("ry", "1");
          lid.style.opacity = "0";
        });
      }, 130);
    }

    // Natural blink cadence while HUD is open
    setInterval(() => {
      if (faceMode === "speaking") return;
      if (Math.random() > 0.5) blinkOnce();
    }, 2800);

    // Cursor-following gaze (paused while thinking — CSS takes over)
    document.addEventListener("mousemove", (e) => {
      if (faceMode === "thinking") return;
      const x = (e.clientX / window.innerWidth - 0.5) * 6;
      const y = (e.clientY / window.innerHeight - 0.5) * 5;
      irisGroups().forEach((eye) => {
        eye.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
      });
    });
    // Independent micro-drift per eye while idle
    setInterval(() => {
      if (faceMode !== "idle") return;
      if (Math.random() > 0.35) return;
      const eyes = irisGroups();
      if (eyes.length < 2) return;
      const dx = (Math.random() - 0.5) * 2.5;
      const dy = (Math.random() - 0.5) * 1.8;
      eyes[0].style.transform = `translate(${dx}px, ${dy}px)`;
      eyes[1].style.transform = `translate(${dx * 0.7 + 0.4}px, ${dy * 0.85}px)`;
    }, 2400);

    async function loadHistory() {
      try {
        const res = await fetch("/hud/history", {
          cache: "no-store",
          headers: hudHeaders(),
        });
        const data = await res.json();
        messagesEl.innerHTML = "";
        const msgs = data.messages || [];
        if (!msgs.length && data.greeting) {
          addBubble("assistant", data.greeting);
        } else {
          msgs.forEach((m) => addBubble(m.role === "user" ? "user" : "assistant", m.content));
        }
      } catch (_) {
        addBubble("assistant", "Hello Reyansh. Immortility online — how can I help you today?");
      }
    }

    async function sendMessage(text, { fromVoice = false, session = null, signal = null } = {}) {
      const msg = (text || "").trim();
      if (!msg) return;
      if (fromVoice && session != null && session !== voiceSession) return;
      if (!fromVoice && busy) return;
      if (!fromVoice) busy = true;
      sendBtn.disabled = true;
      if (!voiceConvo) micBtn.disabled = true;
      if (!fromVoice) {
        addBubble("user", msg);
        input.value = "";
      }
      typing.textContent = fromVoice
        ? "LISTENING DONE — THINKING…"
        : "WORKING IN TERMINAL…";
      typing.classList.add("show");
      setFaceMode("thinking");
      backendHint.textContent = "BACKEND // TERMINAL";
      try {
        const res = await fetch("/hud/chat", {
          method: "POST",
          headers: hudHeaders(),
          body: JSON.stringify({
            message: msg,
            speak: true,
            wait_tts: !!fromVoice,
            from_voice: !!fromVoice,
          }),
          signal: signal || undefined,
        });
        if (fromVoice && session != null && session !== voiceSession) return;
        const data = await res.json();
        if (fromVoice && session != null && session !== voiceSession) return;
        if (data.deduped) return;
        if (data.error === "unauthorized" || res.status === 401) {
          addBubble("assistant", "HUD auth failed — restart Immortility from the terminal.");
          return;
        }
        if (fromVoice) addBubble("user", msg);
        addBubble("assistant", data.reply || data.error || "No reply.");
        if (data.needs_confirm) showConfirm(data.confirm_prompt || data.reply);
        else hideConfirm();
      } catch (err) {
        if (err && err.name === "AbortError") return;
        if (fromVoice && session != null && session !== voiceSession) return;
        addBubble("assistant", "Connection error — is Immortility running in the terminal?");
        setFaceMode("idle");
      } finally {
        if (!(fromVoice && session != null && session !== voiceSession)) {
          typing.classList.remove("show");
        }
        if (!fromVoice) {
          busy = false;
          sendBtn.disabled = false;
          micBtn.disabled = false;
          input.focus();
        }
        if (!awaitingConfirm) backendHint.textContent = "AGENT // READY";
      }
    }

    function isStopPhrase(t) {
      const s = (t || "").toLowerCase().replace(/[!?.]+$/g, "").trim();
      // Exact stop only — never treat "bye audible" / "am I audible" as end
      return (
        s === "stop" ||
        s === "stop talking" ||
        s === "goodbye" ||
        s === "bye" ||
        s === "end conversation" ||
        s === "end voice" ||
        s === "voice off"
      );
    }

    function cancelServerListen() {
      fetch("/hud/listen/cancel", {
        method: "POST",
        headers: hudHeaders(),
        body: "{}",
      }).catch(() => {});
    }

    function stopVoiceSession() {
      voiceConvo = false;
      listening = false;
      voiceSession += 1;
      if (voiceAbort) {
        try { voiceAbort.abort(); } catch (_) {}
        voiceAbort = null;
      }
      cancelServerListen();
      micBtn.classList.remove("is-listening");
      typing.textContent = "VOICE OFF";
      typing.classList.add("show");
      setTimeout(() => typing.classList.remove("show"), 800);
      micBtn.disabled = false;
      sendBtn.disabled = false;
      busy = false;
      setFaceMode("idle");
    }

    async function listenOnce(signal) {
      const res = await fetch("/hud/listen", {
        method: "POST",
        headers: hudHeaders(),
        body: JSON.stringify({ max_seconds: 11 }),
        signal,
      });
      return await res.json();
    }

    async function startVoice() {
      if (voiceConvo || voiceLoopRunning) {
        stopVoiceSession();
        return;
      }

      const session = ++voiceSession;
      voiceConvo = true;
      voiceLoopRunning = true;
      busy = true;
      micBtn.classList.add("is-listening");
      micBtn.disabled = false;
      sendBtn.disabled = true;
      addBubble(
        "assistant",
        "Voice chat on — talk naturally. Tap the mic again or say stop to end."
      );

      let misses = 0;
      try {
        while (voiceConvo && session === voiceSession) {
          listening = true;
          typing.textContent = "LISTENING… SPEAK NATURALLY";
          typing.classList.add("show");
          setFaceMode("listening");

          let transcript = "";
          let data = {};
          const ac = new AbortController();
          voiceAbort = ac;
          try {
            data = await listenOnce(ac.signal);
            transcript = (data.transcript || "").trim();
          } catch (err) {
            if (err && err.name === "AbortError") break;
            if (session !== voiceSession) break;
            addBubble("assistant", "Voice failed — check your HyperX mic in Windows settings.");
            break;
          } finally {
            if (voiceAbort === ac) voiceAbort = null;
            listening = false;
            typing.classList.remove("show");
          }

          if (!voiceConvo || session !== voiceSession) break;
          if (data.reason === "cancelled") break;

          if (!transcript) {
            misses += 1;
            if (data.error) {
              addBubble("assistant", "Mic error: " + data.error);
              break;
            }
            if (misses >= 3) {
              addBubble(
                "assistant",
                "Still not hearing you — check the HyperX mic is selected in Windows, then tap the mic to try again."
              );
              break;
            }
            typing.textContent = "DIDN'T CATCH THAT — TRY AGAIN";
            typing.classList.add("show");
            await new Promise((r) => setTimeout(r, 500));
            typing.classList.remove("show");
            continue;
          }
          misses = 0;
          if (isStopPhrase(transcript)) {
            addBubble("user", transcript);
            addBubble("assistant", "Okay Reyansh — voice chat ended.");
            break;
          }

          const chatAc = new AbortController();
          voiceAbort = chatAc;
          await sendMessage(transcript, {
            fromVoice: true,
            session,
            signal: chatAc.signal,
          });
          if (voiceAbort === chatAc) voiceAbort = null;
          if (!voiceConvo || session !== voiceSession) break;
        }
      } finally {
        if (session === voiceSession) {
          voiceConvo = false;
          listening = false;
          micBtn.classList.remove("is-listening");
          micBtn.disabled = false;
          sendBtn.disabled = false;
          busy = false;
          typing.classList.remove("show");
          setFaceMode("idle");
          voiceLoopRunning = false;
        }
      }
    }

    composer.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });
    micBtn.addEventListener("click", () => startVoice());
    confirmYes.addEventListener("click", () => decideConfirm("yes"));
    confirmNo.addEventListener("click", () => decideConfirm("no"));

    async function pollBridge() {
      try {
        const res = await fetch("/hud/status", {
          cache: "no-store",
          headers: hudHeaders(),
        });
        const data = await res.json();
        if (data.sync) document.getElementById("syncLabel").textContent = data.sync;
        if (data.face && !listening && !awaitingConfirm) setFaceMode(data.face);
        if (typeof data.rag_chunks === "number") {
          const base = awaitingConfirm ? "AWAITING CONFIRM // TERMINAL" : "AGENT // READY";
          backendHint.textContent = `${base} · RAG ${data.rag_chunks}`;
        }
      } catch (_) {}
    }

    window.addEventListener("load", async () => {
      setTimeout(() => document.getElementById("boot").classList.add("hide"), 700);
      await loadHistory();
      input.focus();
      setInterval(pollBridge, 250);
    });
  </script>
</body>
</html>
