<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Immortility</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090b;
      --panel: #0c0e12;
      --line: rgba(255, 43, 43, 0.28);
      --red: #ff2b2b;
      --red-dim: #8a1515;
      --red-hot: #ff5a5a;
      --text: #e8eaed;
      --muted: #7a808c;
      --amber: #f0a030;
      --ok: #3ecf8e;
      --warn: #f0a030;
      --font-display: "Rajdhani", "Bahnschrift", sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Mono", monospace;
      --font-body: "Rajdhani", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--font-body);
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed; inset: 0; z-index: 50;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px
      );
      opacity: 0.35;
    }
    body::after {
      content: "";
      pointer-events: none;
      position: fixed; inset: 0; z-index: 51;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
    }
    .boot {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center;
      background: var(--bg);
      font-family: var(--font-display);
      letter-spacing: 0.4em; font-weight: 700; color: var(--red);
      transition: opacity 0.5s ease;
    }
    .boot.hide { opacity: 0; pointer-events: none; }
    .disconnect {
      display: none; position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      z-index: 90; padding: 6px 14px; background: #3a1010; border: 1px solid var(--red);
      color: var(--red-hot); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    }
    .disconnect.show { display: block; }
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 95;
      max-width: 320px; padding: 12px 16px; background: #1a1208;
      border: 1px solid var(--amber); color: #ffe0a8;
      font-family: var(--font-mono); font-size: 12px;
      box-shadow: 0 0 24px rgba(240,160,48,0.25);
      opacity: 0; transform: translateY(8px); transition: 0.25s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: none; }
    .app {
      display: grid;
      grid-template-rows: 44px 1fr;
      width: 100vw; height: 100vh; max-height: 100dvh;
      overflow: hidden;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; border-bottom: 1px solid var(--line);
      background: #0a0b0e;
    }
    .topbar .brand {
      font-family: var(--font-display); font-weight: 700;
      letter-spacing: 0.35em; font-size: 15px; color: var(--red);
    }
    .topbar .meta {
      font-family: var(--font-mono); font-size: 11px; color: var(--muted);
      display: flex; gap: 18px; align-items: center;
    }
    .topbar .clock { color: var(--text); letter-spacing: 0.06em; }
    .main {
      display: grid;
      grid-template-columns: minmax(240px, 28%) minmax(0, 1fr) minmax(260px, 30%);
      min-height: 0; overflow: hidden;
    }
    .panel {
      position: relative; min-height: 0; background: var(--panel);
      border: 1px solid var(--line);
    }
    .panel::before, .panel::after {
      content: ""; position: absolute; width: 10px; height: 10px;
      border: 1px solid var(--red); pointer-events: none; z-index: 2;
    }
    .panel::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; }
    .panel::after { bottom: 4px; right: 4px; border-left: 0; border-top: 0; }
    .stage {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-right: none; margin: 8px 0 8px 8px; overflow: hidden;
    }
    .face-wrap {
      position: relative; width: min(88%, 320px); aspect-ratio: 300 / 360;
    }
    .face-wrap svg { width: 100%; height: 100%; display: block; }
    .face-aura {
      position: absolute; inset: 8% 12%; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,43,43,0.22), transparent 70%);
      filter: blur(18px); pointer-events: none;
    }
    .listen-ring {
      position: absolute; inset: 6%; border-radius: 50%;
      border: 1px solid rgba(255,43,43,0.35); opacity: 0; pointer-events: none;
    }
    .listen-ring.d2 { inset: 2%; }
    .face-wrap.is-listening .listen-ring {
      opacity: 1; animation: ringPulse 1.4s ease-out infinite;
    }
    .face-wrap.is-listening .listen-ring.d2 { animation-delay: 0.35s; }
    @keyframes ringPulse {
      0% { transform: scale(0.92); opacity: 0.9; }
      100% { transform: scale(1.12); opacity: 0; }
    }
    .face-wrap.is-listening .face-aura { opacity: 1; }
    .face-status {
      margin-top: 10px; display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; color: var(--muted);
    }
    .face-status .live {
      width: 7px; height: 7px; border-radius: 50%; background: var(--red);
      box-shadow: 0 0 8px var(--red); animation: bootPulse 1.6s ease-in-out infinite;
    }
    @keyframes bootPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
    .skin-base { fill: url(#skinBase); }
    .skin-metal { fill: url(#skinHighlight); opacity: 0.55; }
    .skin-edge { fill: none; stroke: var(--red); stroke-width: 1.2; opacity: 0.55; }
    .circuits path { fill: none; stroke: rgba(255,43,43,0.45); stroke-width: 1; }
    .circuits .node { fill: var(--red-hot); }
    .brow, .feature, .lip { fill: none; stroke: var(--red); stroke-width: 2; stroke-linecap: round; }
    .lip-fill { fill: rgba(255,43,43,0.35); stroke: var(--red); }
    .sclera { fill: #1a0508; stroke: var(--red-dim); stroke-width: 1; }
    .iris { fill: url(#eyeGlow); filter: url(#redGlow); }
    .pupil { fill: #0a0002; }
    .eye-shine { fill: #ffc8cc; opacity: 0.85; }
    .eye-shine-soft { fill: #fff; opacity: 0.35; }
    .lid { fill: #120205; opacity: 0; }
    .mouth-talk { opacity: 0; transform-origin: 150px 240px; }
    .mouth-idle { opacity: 1; }
    .face-wrap.is-speaking .mouth-talk {
      opacity: 1; animation: talkMouth 0.28s ease-in-out infinite alternate;
    }
    .face-wrap.is-speaking .mouth-idle { opacity: 0; }
    @keyframes talkMouth { from { transform: scaleY(0.55); } to { transform: scaleY(1.15); } }
    .face-wrap.is-thinking .iris-group { animation: thinkGaze 2.2s ease-in-out infinite; }
    @keyframes thinkGaze {
      0%,100% { transform: translate(0,0); }
      40% { transform: translate(3px,-2px); }
      70% { transform: translate(-2px,1px); }
    }
    .chat {
      display: grid; grid-template-rows: auto 1fr auto;
      margin: 8px 4px; min-width: 0; overflow: hidden;
    }
    .chat-header {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 10px 14px 8px; border-bottom: 1px solid var(--line);
      font-family: var(--font-display);
    }
    .chat-header h1 { font-size: 14px; letter-spacing: 0.28em; color: var(--red); font-weight: 700; }
    .chat-header span { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
    #log {
      overflow-y: auto; overflow-x: hidden; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 10px; min-height: 0;
    }
    .bubble {
      max-width: 92%; padding: 10px 12px; font-size: 14px; line-height: 1.45;
      border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
    }
    .bubble .who {
      display: block; font-family: var(--font-mono); font-size: 9px;
      letter-spacing: 0.16em; color: var(--muted); margin-bottom: 4px;
    }
    .bubble.assistant { align-self: flex-start; background: #0a0c10; }
    .bubble.user {
      align-self: flex-end; background: rgba(255,43,43,0.08);
      border-color: rgba(255,43,43,0.4);
    }
    .chat-footer { border-top: 1px solid var(--line); padding: 8px 10px 10px; }
    .typing {
      display: none; font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 0.12em; color: var(--red-hot); margin-bottom: 6px;
    }
    .typing.show { display: block; }
    .confirm-bar {
      display: none; gap: 8px; align-items: center; margin-bottom: 8px;
      padding: 8px; border: 1px solid var(--amber); background: #161208;
    }
    .confirm-bar.show { display: flex; flex-wrap: wrap; }
    .confirm-bar p { flex: 1; font-size: 12px; color: #ffe0a8; min-width: 140px; }
    .confirm-bar button {
      font-family: var(--font-mono); font-size: 11px; padding: 6px 12px;
      border: 1px solid var(--line); background: #12141a; color: var(--text); cursor: pointer;
    }
    .confirm-bar button.yes { border-color: var(--ok); color: var(--ok); }
    .composer { display: grid; grid-template-columns: auto auto auto 1fr auto; gap: 8px; align-items: end; }
    .composer textarea {
      resize: none; min-height: 44px; max-height: 90px; padding: 10px;
      background: #08090b; border: 1px solid var(--line); color: var(--text);
      font-family: var(--font-body); font-size: 14px;
    }
    .composer textarea:focus { outline: 1px solid var(--red); }
    .mic-btn, .stop-btn, .attach-btn, #sendBtn {
      width: 44px; height: 44px; border: 1px solid var(--line);
      background: #0c0e12; color: var(--text); cursor: pointer;
      display: grid; place-items: center;
    }
    .mic-btn svg, .stop-btn svg, .attach-btn svg { width: 18px; height: 18px; fill: none; stroke: var(--red); stroke-width: 1.8; }
    .attach-file {
      position: absolute; width: 0.1px; height: 0.1px; opacity: 0; overflow: hidden;
    }
    .mic-btn.is-listening { background: rgba(255,43,43,0.2); border-color: var(--red); }
    .attach-btn:hover { border-color: var(--red); }
    .attach-btn:disabled { opacity: 0.45; cursor: default; }
    .panel.chat.drop-target { outline: 1px dashed var(--red); outline-offset: -4px; }
    .attach-chips {
      display: none; flex-wrap: wrap; gap: 6px; margin: 0 0 8px;
    }
    .attach-chips.show { display: flex; }
    .attach-chip {
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 100%; padding: 4px 8px;
      border: 1px solid rgba(255,43,43,0.45); background: rgba(255,43,43,0.08);
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
      color: var(--text);
    }
    .attach-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-chip button {
      border: none; background: transparent; color: var(--muted);
      cursor: pointer; font-size: 12px; line-height: 1; padding: 0;
    }
    .attach-chip button:hover { color: var(--red-hot); }
    .stop-btn { color: var(--red-hot); }
    .stop-btn:hover { border-color: var(--red); }
    #sendBtn {
      width: auto; padding: 0 14px; font-family: var(--font-mono);
      font-size: 11px; letter-spacing: 0.14em; color: var(--red);
    }
    .side {
      display: grid;
      grid-template-rows: auto auto minmax(120px, 1fr) minmax(100px, 0.9fr);
      gap: 8px; margin: 8px 8px 8px 0; min-height: 0; overflow: hidden;
    }
    .side > .panel { margin: 0; padding: 10px 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .side h2 {
      font-family: var(--font-display); font-size: 12px; letter-spacing: 0.22em;
      color: var(--red); margin-bottom: 8px; font-weight: 700;
    }
    .vital-row {
      display: grid; grid-template-columns: 56px 1fr 48px; gap: 8px;
      align-items: center; margin-bottom: 6px;
      font-family: var(--font-mono); font-size: 10px; color: var(--muted);
    }
    .bar { height: 6px; background: #151820; border: 1px solid var(--line); overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%; background: var(--red); transition: width 0.4s ease; }
    .vital-row .val { text-align: right; color: var(--text); }
    .conf-wrap { display: none; margin-top: 8px; align-items: center; gap: 10px; }
    .conf-wrap.show { display: flex; }
    .conf-ring {
      width: 42px; height: 42px; border-radius: 50%;
      border: 2px solid var(--line); border-top-color: var(--red);
      display: grid; place-items: center;
      font-family: var(--font-mono); font-size: 10px; color: var(--text);
    }
    .clock-big {
      font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.08em; color: var(--text);
    }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 8px;
      font-family: var(--font-mono); font-size: 9px; text-align: center;
    }
    .cal-grid .dow { color: var(--muted); }
    .cal-grid .day { padding: 3px 0; color: var(--text); }
    .cal-grid .day.out { color: #333843; }
    .cal-grid .day.today {
      outline: 1px solid var(--red); color: var(--red-hot);
    }
    .todo-form { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-bottom: 8px; }
    .todo-form input {
      background: #08090b; border: 1px solid var(--line); color: var(--text);
      padding: 6px 8px; font-family: var(--font-mono); font-size: 11px;
    }
    .todo-form button {
      border: 1px solid var(--line); background: #12141a; color: var(--red);
      font-family: var(--font-mono); font-size: 10px; padding: 0 10px; cursor: pointer;
    }
    .todo-list { overflow-y: auto; min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .todo-item {
      display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start;
      padding: 6px; border: 1px solid var(--line); font-size: 12px;
    }
    .todo-item.due { border-color: var(--amber); background: rgba(240,160,48,0.08); }
    .todo-item.done { opacity: 0.45; text-decoration: line-through; }
    .todo-item button {
      border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px;
    }
    #eventLog {
      overflow-y: auto; min-height: 0; flex: 1;
      font-family: var(--font-mono); font-size: 10px; line-height: 1.45;
    }
    #eventLog .ev { margin-bottom: 6px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
    #eventLog .ev.ok { border-color: var(--ok); color: #b8f0d4; }
    #eventLog .ev.warn { border-color: var(--warn); color: #ffe0a8; }
    @media (max-width: 1100px) {
      .main { grid-template-columns: minmax(200px, 26%) 1fr minmax(220px, 32%); }
    }
    @media (max-width: 820px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 28% 1fr 36%; }
      .side { grid-template-rows: auto auto 1fr 1fr; margin: 0 8px 8px; }
    }

  </style>
</head>
<body data-face="idle">
  <div class="boot" id="boot"><span>IMMORTILITY</span></div>
  <div class="disconnect" id="disconnect">LINK DOWN // RECONNECTING</div>
  <div class="toast" id="toast"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">IMMORTILITY</div>
      <div class="meta">
        <span id="modelHint">AGENT // READY</span>
        <span class="clock" id="topClock">--:--:--</span>
      </div>
    </header>

    <div class="main">
      <section class="panel stage">
        <div class="face-wrap is-idle" id="core">
        <div class="face-aura" aria-hidden="true"></div>
        <div class="listen-ring"></div>
        <div class="listen-ring d2"></div>
        <svg viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg" aria-label="Immortility face">
          <defs>
            <radialGradient id="skinBase" cx="50%" cy="28%" r="75%">
              <stop offset="0%" stop-color="#3d0a10"/>
              <stop offset="35%" stop-color="#190306"/>
              <stop offset="75%" stop-color="#090104"/>
              <stop offset="100%" stop-color="#000000"/>
            </radialGradient>
            <radialGradient id="skinHighlight" cx="62%" cy="22%" r="55%">
              <stop offset="0%" stop-color="#ff4d5f"/>
              <stop offset="40%" stop-color="#8a101f"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <radialGradient id="cheekGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ff2a3c" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="transparent"/>
            </radialGradient>
            <radialGradient id="eyeGlow" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ff6675"/>
              <stop offset="55%" stop-color="#aa1020"/>
              <stop offset="100%" stop-color="#55000b"/>
            </radialGradient>
            <linearGradient id="jawShade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff3244" stop-opacity="0"/>
              <stop offset="100%" stop-color="#ff3244" stop-opacity="0.18"/>
            </linearGradient>
            <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur stdDeviation="3.5" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <filter id="strongGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="7" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <clipPath id="faceClip">
              <path d="M150 48 C110 50 72 86 63 145 C58 180 63 232 84 270 C98 298 120 320 150 328 C180 320 202 298 216 270 C237 232 242 180 237 145 C228 86 190 50 150 48 Z"/>
            </clipPath>
          </defs>

          <g class="face-rig" id="faceRig">
            <path class="skin-base" d="M150 48 C110 50 72 86 63 145 C58 180 63 232 84 270 C98 298 120 320 150 328 C180 320 202 298 216 270 C237 232 242 180 237 145 C228 86 190 50 150 48 Z"/>
            <path class="skin-metal" d="M150 48 C190 58 225 112 214 182 C205 248 184 292 150 325 C176 288 184 232 178 160 C172 98 162 70 150 48 Z"/>
            <path fill="url(#jawShade)" opacity="0.7" d="M84 270 C98 298 120 320 150 328 C180 320 202 298 216 270 C200 292 175 308 150 312 C125 308 100 292 84 270 Z"/>
            <path class="skin-edge" d="M150 48 C110 50 72 86 63 145 C58 180 63 232 84 270 C98 298 120 320 150 328 C180 320 202 298 216 270 C237 232 242 180 237 145 C228 86 190 50 150 48 Z"/>

            <g class="circuits" clip-path="url(#faceClip)">
              <path d="M118 120 L95 140 L110 168"/>
              <path d="M182 120 L205 142 L190 170"/>
              <path d="M140 235 L124 262"/>
              <path d="M160 235 L176 262"/>
              <path d="M150 100 L150 130 L138 155"/>
              <path d="M150 200 L150 225"/>
              <circle class="node" cx="95" cy="140" r="2.2"/>
              <circle class="node" cx="205" cy="142" r="2.2"/>
              <circle class="node" cx="110" cy="168" r="1.6"/>
              <circle class="node" cx="190" cy="170" r="1.6"/>
              <circle class="node" cx="124" cy="262" r="1.8"/>
              <circle class="node" cx="176" cy="262" r="1.8"/>
              <circle class="node" cx="150" cy="130" r="1.5"/>
            </g>

            <ellipse cx="96" cy="198" rx="16" ry="10" fill="url(#cheekGlow)"/>
            <ellipse cx="204" cy="198" rx="16" ry="10" fill="url(#cheekGlow)"/>

            <path class="brow" id="browL" d="M90 122 C 104 112 122 110 136 118"/>
            <path class="brow" id="browR" d="M164 118 C 178 110 196 112 210 122"/>

            <path class="feature" d="M150 152 C 148 168 147 180 150 190"/>
            <path class="feature" d="M143 190 C 148 194 152 194 157 190"/>

            <g id="eyeL">
              <ellipse class="sclera" cx="112" cy="145" rx="19" ry="10"/>
              <g class="iris-group" id="irisL">
                <circle class="iris" cx="112" cy="145" r="8"/>
                <circle class="pupil" cx="112" cy="145" r="3.1"/>
                <circle class="eye-shine" cx="109" cy="142" r="2"/>
                <circle class="eye-shine-soft" cx="114" cy="147" r="0.8"/>
              </g>
              <ellipse class="lid" id="lidL" cx="112" cy="145" rx="20" ry="1"/>
            </g>
            <g id="eyeR">
              <ellipse class="sclera" cx="188" cy="145" rx="19" ry="10"/>
              <g class="iris-group" id="irisR">
                <circle class="iris" cx="188" cy="145" r="8"/>
                <circle class="pupil" cx="188" cy="145" r="3.1"/>
                <circle class="eye-shine" cx="185" cy="142" r="2"/>
                <circle class="eye-shine-soft" cx="190" cy="147" r="0.8"/>
              </g>
              <ellipse class="lid" id="lidR" cx="188" cy="145" rx="20" ry="1"/>
            </g>

            <path class="lip mouth-idle" id="mouthIdle"
              d="M124 232 C 140 244 160 244 176 232"/>
            <path class="lip lip-fill mouth-talk" id="mouthTalk"
              d="M126 228 C 142 228 158 228 174 228
                 C 170 242 160 250 150 250
                 C 140 250 130 242 126 228 Z"/>
          </g>
        </svg>
      </div>
        <div class="face-status"><span class="live"></span><span id="syncLabel">SYNCED</span></div>
      </section>

      <section class="panel chat">
        <header class="chat-header">
          <h1>CHAT</h1>
          <span id="backendHint">AGENT // READY</span>
        </header>
        <div id="log"></div>
        <div class="chat-footer">
          <div class="typing" id="typing">IMMORTILITY IS WORKING…</div>
          <div class="confirm-bar" id="confirmBar">
            <p id="confirmText">Confirm this action?</p>
            <button type="button" class="yes" id="confirmYes">YES</button>
            <button type="button" id="confirmNo">NO</button>
          </div>
          <div class="attach-chips" id="attachChips"></div>
          <form class="composer" id="composer">
            <button type="button" class="mic-btn" id="micBtn" title="Voice — start conversation" aria-label="Voice">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/>
                <path d="M5 11a7 7 0 0 0 14 0"/>
                <path d="M12 18v3"/>
              </svg>
            </button>
            <button type="button" class="stop-btn" id="stopBtn" title="Stop voice / generation" aria-label="Stop">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" fill="currentColor" stroke="none"/>
              </svg>
            </button>
            <button type="button" class="attach-btn" id="attachBtn" title="Attach a local PDF, DOC, DOCX, PPTX, XLSX, CSV, or TXT (up to 20 MB)" aria-label="Attach files">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14"/>
                <path d="M5 12h14"/>
              </svg>
            </button>
            <input type="file" id="filePick" class="attach-file" multiple
              accept=".pdf,.doc,.docx,.pptx,.xlsx,.csv,.txt,.md">
            <textarea id="input" rows="2" placeholder="Ask Immortility… or attach a document" autocomplete="off"></textarea>
            <button type="submit" id="sendBtn">SEND</button>
          </form>
        </div>
      </section>

      <aside class="side">
        <div class="panel" id="vitalsPanel">
          <h2>SYSTEM VITALS</h2>
          <div class="vital-row"><span>CPU</span><div class="bar"><i id="barCpu"></i></div><span class="val" id="valCpu">--</span></div>
          <div class="vital-row"><span>MEM</span><div class="bar"><i id="barMem"></i></div><span class="val" id="valMem">--</span></div>
          <div class="vital-row"><span>GPU</span><div class="bar"><i id="barGpu"></i></div><span class="val" id="valGpu">--</span></div>
          <div class="vital-row"><span>VRAM</span><div class="bar"><i id="barVram"></i></div><span class="val" id="valVram">--</span></div>
          <div class="vital-row"><span>LATENCY</span><div class="bar"><i id="barLat"></i></div><span class="val" id="valLat">--</span></div>
          <div class="conf-wrap" id="confWrap">
            <div class="conf-ring" id="confRing">--</div>
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">TASK CONF</span>
          </div>
        </div>
        <div class="panel">
          <h2>CLOCK</h2>
          <div class="clock-big" id="sideClock">--:--:--</div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div class="panel">
          <h2>REMINDERS</h2>
          <form class="todo-form" id="todoForm">
            <input id="todoText" placeholder="Task…" maxlength="500" />
            <button type="submit">ADD</button>
          </form>
          <input type="datetime-local" id="todoDue" style="width:100%;margin-bottom:8px;background:#08090b;border:1px solid var(--line);color:var(--text);padding:4px 6px;font-family:var(--font-mono);font-size:10px" />
          <div class="todo-list" id="todoList"></div>
        </div>
        <div class="panel">
          <h2>EVENTS</h2>
          <div id="eventLog"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>

    const core = document.getElementById("core");
    const messagesEl = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");
    const stopBtn = document.getElementById("stopBtn");
    const typing = document.getElementById("typing");
    const composer = document.getElementById("composer");
    const attachBtn = document.getElementById("attachBtn");
    const filePick = document.getElementById("filePick");
    const attachChips = document.getElementById("attachChips");
    const confirmBar = document.getElementById("confirmBar");
    const confirmText = document.getElementById("confirmText");
    const confirmYes = document.getElementById("confirmYes");
    const confirmNo = document.getElementById("confirmNo");
    const backendHint = document.getElementById("backendHint");
    const modelHint = document.getElementById("modelHint");
    const disconnectEl = document.getElementById("disconnect");
    const toastEl = document.getElementById("toast");
    let faceMode = "idle";
    let talkAnim = null;
    let busy = false;
    let listening = false;
    let voiceConvo = false;
    let voiceSession = 0;
    let voiceLoopRunning = false;
    let voiceAbort = null;
    let chatAbort = null;
    let awaitingConfirm = false;
    let pendingAttachments = [];
    let seenDueFired = new Set();
    let calMonth = new Date();

    function hudHeaders(extra = {}) {
      const token = window.HUD_TOKEN || "";
      return {
        "Content-Type": "application/json",
        "X-Immortility-Token": token,
        ...extra,
      };
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 5000);
    }

    function notifyDue(text) {
      showToast("DUE: " + text);
      try {
        if (!window.Notification) return;
        const show = () => {
          try {
            new Notification("Immortility reminder", {
              body: text,
              requireInteraction: true,
              tag: "immortility-due",
            });
          } catch (_) {}
        };
        if (Notification.permission === "granted") show();
        else if (Notification.permission !== "denied") {
          Notification.requestPermission().then((p) => { if (p === "granted") show(); });
        }
      } catch (_) {}
    }

    function showConfirm(prompt) {
      awaitingConfirm = true;
      confirmText.textContent = prompt || "Confirm this action? (yes / no)";
      confirmBar.classList.add("show");
      backendHint.textContent = "AWAITING CONFIRM // TERMINAL";
    }

    function hideConfirm() {
      awaitingConfirm = false;
      confirmBar.classList.remove("show");
      backendHint.textContent = "AGENT // READY";
    }

    async function decideConfirm(decision) {
      if (!awaitingConfirm) return;
      confirmYes.disabled = true;
      confirmNo.disabled = true;
      typing.textContent = decision === "yes" ? "RUNNING APPROVED ACTION…" : "CANCELLING…";
      typing.classList.add("show");
      try {
        const res = await fetch("/hud/confirm", {
          method: "POST",
          headers: hudHeaders(),
          body: JSON.stringify({ decision, speak: true }),
        });
        const data = await res.json();
        hideConfirm();
        addBubble("user", decision === "yes" ? "yes" : "no");
        addBubble("assistant", data.reply || data.error || "Done.");
        if (data.needs_confirm) showConfirm(data.confirm_prompt || data.reply);
      } catch (_) {
        addBubble("assistant", "Confirm failed — check the Immortility terminal.");
        hideConfirm();
      } finally {
        confirmYes.disabled = false;
        confirmNo.disabled = false;
        typing.classList.remove("show");
      }
    }

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = "bubble " + (role === "user" ? "user" : "assistant");
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "user" ? "REYANSH" : "IMMORTILITY";
      div.appendChild(who);
      div.appendChild(document.createTextNode(text));
      messagesEl.appendChild(div);
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    const irisGroups = () => document.querySelectorAll(".iris-group");

    function setFaceMode(mode) {
      mode = (mode || "idle").toLowerCase();
      if (mode === faceMode) {
        if (mode === "speaking") ensureTalkAnim();
        return;
      }
      faceMode = mode;
      document.body.dataset.face = mode;
      core.classList.remove("is-idle", "is-listening", "is-speaking", "is-thinking");
      if (mode === "listening") core.classList.add("is-listening");
      else if (mode === "speaking") core.classList.add("is-speaking");
      else if (mode === "thinking") core.classList.add("is-thinking");
      else core.classList.add("is-idle");
      irisGroups().forEach((eye) => { eye.style.transform = ""; });
      if (mode === "speaking") ensureTalkAnim();
      else stopTalkAnim();
    }

    function ensureTalkAnim() { /* CSS */ }
    function stopTalkAnim() { talkAnim = null; }

    function blinkOnce() {
      const lids = [document.getElementById("lidL"), document.getElementById("lidR")];
      lids.forEach((lid) => {
        if (!lid) return;
        lid.setAttribute("ry", "11");
        lid.style.opacity = "1";
      });
      setTimeout(() => {
        lids.forEach((lid) => {
          if (!lid) return;
          lid.setAttribute("ry", "1");
          lid.style.opacity = "0";
        });
      }, 130);
    }

    setInterval(() => {
      if (faceMode === "speaking") return;
      if (Math.random() > 0.5) blinkOnce();
    }, 2800);

    document.addEventListener("mousemove", (e) => {
      if (faceMode === "thinking") return;
      const x = (e.clientX / window.innerWidth - 0.5) * 6;
      const y = (e.clientY / window.innerHeight - 0.5) * 5;
      irisGroups().forEach((eye) => {
        eye.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
      });
    });
    setInterval(() => {
      if (faceMode !== "idle") return;
      if (Math.random() > 0.35) return;
      const eyes = irisGroups();
      if (eyes.length < 2) return;
      const dx = (Math.random() - 0.5) * 2.5;
      const dy = (Math.random() - 0.5) * 1.8;
      eyes[0].style.transform = `translate(${dx}px, ${dy}px)`;
      eyes[1].style.transform = `translate(${dx * 0.7 + 0.4}px, ${dy * 0.85}px)`;
    }, 2400);

    function tickClock() {
      const now = new Date();
      const s = now.toLocaleTimeString([], { hour12: false });
      document.getElementById("topClock").textContent = s;
      document.getElementById("sideClock").textContent = s;
    }

    function renderCalendar() {
      const grid = document.getElementById("calGrid");
      const y = calMonth.getFullYear();
      const m = calMonth.getMonth();
      const first = new Date(y, m, 1);
      const start = (first.getDay() + 6) % 7; // Mon-first
      const daysIn = new Date(y, m + 1, 0).getDate();
      const today = new Date();
      const parts = ["MO","TU","WE","TH","FR","SA","SU"].map(
        (d) => `<div class="dow">${d}</div>`
      );
      for (let i = 0; i < start; i++) parts.push(`<div class="day out"></div>`);
      for (let d = 1; d <= daysIn; d++) {
        const isToday =
          d === today.getDate() && m === today.getMonth() && y === today.getFullYear();
        parts.push(`<div class="day${isToday ? " today" : ""}">${d}</div>`);
      }
      grid.innerHTML = parts.join("");
    }

    function setBar(id, pct) {
      const el = document.getElementById(id);
      if (!el) return;
      const p = Math.max(0, Math.min(100, pct == null ? 0 : Number(pct)));
      el.style.width = p + "%";
    }

    async function pollStats() {
      try {
        const res = await fetch("/api/stats", { cache: "no-store", headers: hudHeaders() });
        if (!res.ok) throw new Error("stats " + res.status);
        const s = await res.json();
        disconnectEl.classList.remove("show");
        const cpu = s.cpu_percent;
        setBar("barCpu", cpu);
        document.getElementById("valCpu").textContent =
          cpu == null ? "--" : Math.round(cpu) + "%";
        const memPct =
          s.mem_total_gb > 0 ? (100 * s.mem_used_gb) / s.mem_total_gb : null;
        setBar("barMem", memPct);
        document.getElementById("valMem").textContent =
          s.mem_used_gb == null
            ? "--"
            : s.mem_used_gb.toFixed(1) + "/" + (s.mem_total_gb || 0).toFixed(0) + "G";
        if (s.gpu_percent == null) {
          setBar("barGpu", 0);
          document.getElementById("valGpu").textContent = "--";
        } else {
          setBar("barGpu", s.gpu_percent);
          document.getElementById("valGpu").textContent = Math.round(s.gpu_percent) + "%";
        }
        if (s.vram_used_gb == null || s.vram_total_gb == null) {
          setBar("barVram", 0);
          document.getElementById("valVram").textContent = "--";
        } else {
          setBar("barVram", (100 * s.vram_used_gb) / s.vram_total_gb);
          document.getElementById("valVram").textContent =
            s.vram_used_gb.toFixed(1) + "/" + s.vram_total_gb.toFixed(0) + "G";
        }
        if (s.ollama_latency_ms == null) {
          setBar("barLat", 0);
          document.getElementById("valLat").textContent = "--";
        } else {
          setBar("barLat", Math.min(100, s.ollama_latency_ms / 20));
          document.getElementById("valLat").textContent = s.ollama_latency_ms + "ms";
        }
        const conf = s.task_confidence;
        const wrap = document.getElementById("confWrap");
        if (conf == null || conf === "") {
          wrap.classList.remove("show");
        } else {
          wrap.classList.add("show");
          document.getElementById("confRing").textContent =
            typeof conf === "number" ? Math.round(conf * 100) + "%" : String(conf);
        }
      } catch (_) {
        disconnectEl.classList.add("show");
      }
    }

    async function loadTodos() {
      try {
        const res = await fetch("/api/todos", { cache: "no-store", headers: hudHeaders() });
        const data = await res.json();
        const list = document.getElementById("todoList");
        list.innerHTML = "";
        (data.todos || []).forEach((t) => {
          if (t.due_fired && !t.done && !seenDueFired.has(t.id)) {
            seenDueFired.add(t.id);
            notifyDue(t.text || "Reminder");
          } else if (t.due_fired) {
            seenDueFired.add(t.id);
          }
          const row = document.createElement("div");
          row.className =
            "todo-item" +
            (t.done ? " done" : "") +
            (t.due_fired && !t.done ? " due" : "");
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!t.done;
          cb.addEventListener("change", () => patchTodo(t.id, { done: cb.checked }));
          const body = document.createElement("div");
          body.textContent = t.text || "";
          if (t.due_at) {
            const due = document.createElement("div");
            due.style.cssText = "font-size:9px;color:var(--muted);margin-top:2px;font-family:var(--font-mono)";
            due.textContent = "due " + t.due_at;
            body.appendChild(due);
          }
          const del = document.createElement("button");
          del.type = "button";
          del.textContent = "×";
          del.title = "Delete";
          del.addEventListener("click", () => deleteTodo(t.id));
          row.appendChild(cb);
          row.appendChild(body);
          row.appendChild(del);
          list.appendChild(row);
        });
      } catch (_) {}
    }

    async function patchTodo(id, fields) {
      await fetch("/api/todos", {
        method: "PATCH",
        headers: hudHeaders(),
        body: JSON.stringify({ id, ...fields }),
      });
      await loadTodos();
    }

    async function deleteTodo(id) {
      await fetch("/api/todos?id=" + encodeURIComponent(id), {
        method: "DELETE",
        headers: hudHeaders(),
      });
      await loadTodos();
    }

    document.getElementById("todoForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = document.getElementById("todoText").value.trim();
      if (!text) return;
      const dueRaw = document.getElementById("todoDue").value;
      let due_at = null;
      if (dueRaw) {
        try {
          due_at = new Date(dueRaw).toISOString();
        } catch (_) {
          due_at = dueRaw;
        }
      }
      await fetch("/api/todos", {
        method: "POST",
        headers: hudHeaders(),
        body: JSON.stringify({ text, due_at }),
      });
      document.getElementById("todoText").value = "";
      document.getElementById("todoDue").value = "";
      await loadTodos();
    });

    async function pollEvents() {
      try {
        const res = await fetch("/api/events?limit=40", {
          cache: "no-store",
          headers: hudHeaders(),
        });
        const data = await res.json();
        const box = document.getElementById("eventLog");
        const events = data.events || [];
        if (!events.length) {
          box.innerHTML = "";
          return;
        }
        box.innerHTML = events
          .map((ev) => {
            const level = String(ev.level || ev.severity || "info").toLowerCase();
            const cls =
              level.includes("warn") || level.includes("error")
                ? "warn"
                : level.includes("ok") || level.includes("info") || level.includes("success")
                  ? "ok"
                  : "";
            const msg =
              ev.message ||
              ev.event ||
              ev.type ||
              JSON.stringify(ev).slice(0, 160);
            const ts = ev.ts || ev.time || ev.timestamp || "";
            return `<div class="ev ${cls}">${ts ? ts + " · " : ""}${escapeHtml(String(msg))}</div>`;
          })
          .reverse()
          .join("");
      } catch (_) {}
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadHistory() {
      try {
        const res = await fetch("/hud/history", {
          cache: "no-store",
          headers: hudHeaders(),
        });
        const data = await res.json();
        messagesEl.innerHTML = "";
        const msgs = data.messages || [];
        if (!msgs.length && data.greeting) {
          addBubble("assistant", data.greeting);
        } else {
          msgs.forEach((m) => addBubble(m.role === "user" ? "user" : "assistant", m.content));
        }
      } catch (_) {
        addBubble("assistant", "Hello Reyansh. Immortility online — how can I help you today?");
      }
    }

    function renderAttachChips() {
      attachChips.innerHTML = "";
      if (!pendingAttachments.length) {
        attachChips.classList.remove("show");
        return;
      }
      attachChips.classList.add("show");
      pendingAttachments.forEach((file, idx) => {
        const chip = document.createElement("div");
        chip.className = "attach-chip";
        const label = document.createElement("span");
        const extra = file.truncated ? " · clipped" : "";
        label.textContent = (file.name || "file") + extra;
        label.title = file.name || "";
        const rm = document.createElement("button");
        rm.type = "button";
        rm.setAttribute("aria-label", "Remove " + (file.name || "file"));
        rm.textContent = "×";
        rm.addEventListener("click", () => {
          pendingAttachments.splice(idx, 1);
          renderAttachChips();
        });
        chip.appendChild(label);
        chip.appendChild(rm);
        attachChips.appendChild(chip);
      });
    }

    async function uploadPickedFiles(list) {
      const files = Array.from(list || []).filter(Boolean);
      if (!files.length) return;
      if (pendingAttachments.length + files.length > 4) {
        showToast("Attach at most 4 files.");
        return;
      }
      const fd = new FormData();
      files.forEach((f) => fd.append("files", f, f.name));
      attachBtn.disabled = true;
      typing.textContent = "PARSING DOCUMENT…";
      typing.classList.add("show");
      try {
        const res = await fetch("/hud/upload", {
          method: "POST",
          headers: { "X-Immortility-Token": window.HUD_TOKEN || "" },
          body: fd,
        });
        const raw = await res.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (_) {
          showToast(res.status === 413 ? "File too large." : "Upload failed. Try a local PDF or DOCX.");
          return;
        }
        (data.files || []).forEach((item) => {
          if (item && item.id) pendingAttachments.push(item);
        });
        (data.errors || []).forEach((err) => showToast(err));
        if (!data.ok && !(data.files || []).length) {
          showToast(data.error || "Upload failed.");
        }
        renderAttachChips();
      } catch (_) {
        showToast("Upload failed — is Immortility running?");
      } finally {
        attachBtn.disabled = false;
        typing.classList.remove("show");
        filePick.value = "";
      }
    }

    async function pickLocalFiles() {
      if (window.showOpenFilePicker) {
        try {
          const handles = await window.showOpenFilePicker({
            multiple: true,
            excludeAcceptAllOption: false,
            types: [{
              description: "Documents",
              accept: {
                "application/pdf": [".pdf"],
                "application/msword": [".doc"],
                "application/vnd.openxmlformats-officedocument.wordprocessingml.document": [".docx"],
                "application/vnd.openxmlformats-officedocument.presentationml.presentation": [".pptx"],
                "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"],
                "text/csv": [".csv"],
                "text/plain": [".txt", ".md"],
              },
            }],
          });
          const files = [];
          for (const handle of handles) files.push(await handle.getFile());
          await uploadPickedFiles(files);
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      filePick.click();
    }

    async function sendMessage(text, { fromVoice = false, session = null, signal = null } = {}) {
      const msg = (text || "").trim();
      const attachIds = pendingAttachments.map((a) => a.id).filter(Boolean);
      const attachNames = pendingAttachments.map((a) => a.name).filter(Boolean);
      if (!msg && !attachIds.length) return;
      if (fromVoice && session != null && session !== voiceSession) return;
      if (!fromVoice && busy) return;
      if (!fromVoice) busy = true;
      sendBtn.disabled = true;
      if (!voiceConvo) micBtn.disabled = true;
      if (!fromVoice) {
        const shown = msg || ("Attached: " + attachNames.join(", "));
        addBubble("user", shown);
        input.value = "";
        pendingAttachments = [];
        renderAttachChips();
        if (chatAbort) {
          try { chatAbort.abort(); } catch (_) {}
        }
        chatAbort = new AbortController();
        signal = chatAbort.signal;
      }
      typing.textContent = fromVoice
        ? "LISTENING DONE — STREAMING…"
        : "STREAMING…";
      typing.classList.add("show");
      setFaceMode("thinking");
      backendHint.textContent = "BACKEND // TERMINAL";
      try {
        const res = await fetch("/hud/chat", {
          method: "POST",
          headers: hudHeaders(),
          body: JSON.stringify({
            message: msg,
            attachments: attachIds,
            speak: true,
            wait_tts: !!fromVoice,
            from_voice: !!fromVoice,
            stream: true,
          }),
          signal: signal || undefined,
        });
        if (fromVoice && session != null && session !== voiceSession) return;
        const data = await res.json();
        if (fromVoice && session != null && session !== voiceSession) return;
        if (data.cancelled) return;
        if (data.deduped) return;
        if (data.error === "unauthorized" || res.status === 401) {
          addBubble("assistant", "HUD auth failed — restart Immortility from the terminal.");
          return;
        }
        if (fromVoice) addBubble("user", msg);
        addBubble("assistant", data.reply || data.error || "No reply.");
        if (data.needs_confirm) showConfirm(data.confirm_prompt || data.reply);
        else hideConfirm();
      } catch (err) {
        if (err && err.name === "AbortError") return;
        if (fromVoice && session != null && session !== voiceSession) return;
        addBubble("assistant", "Connection error — is Immortility running in the terminal?");
        setFaceMode("idle");
      } finally {
        if (!(fromVoice && session != null && session !== voiceSession)) {
          typing.classList.remove("show");
        }
        if (!fromVoice) {
          busy = false;
          sendBtn.disabled = false;
          micBtn.disabled = false;
          chatAbort = null;
          input.focus();
        }
        if (!awaitingConfirm) backendHint.textContent = "AGENT // READY";
      }
    }

    function isStopPhrase(t) {
      const s = (t || "").toLowerCase().replace(/[!?.]+$/g, "").trim();
      return (
        s === "stop" ||
        s === "stop talking" ||
        s === "goodbye" ||
        s === "bye" ||
        s === "end conversation" ||
        s === "end voice" ||
        s === "voice off"
      );
    }

    function cancelServerListen() {
      fetch("/hud/listen/cancel", {
        method: "POST",
        headers: hudHeaders(),
        body: "{}",
      }).catch(() => {});
    }

    function hardStop() {
      voiceConvo = false;
      listening = false;
      voiceSession += 1;
      voiceLoopRunning = false;
      if (voiceAbort) {
        try { voiceAbort.abort(); } catch (_) {}
        voiceAbort = null;
      }
      if (chatAbort) {
        try { chatAbort.abort(); } catch (_) {}
        chatAbort = null;
      }
      cancelServerListen();
      fetch("/hud/stop", {
        method: "POST",
        headers: hudHeaders(),
        body: "{}",
      }).catch(() => {});
      micBtn.classList.remove("is-listening");
      typing.textContent = "STOPPED";
      typing.classList.add("show");
      setTimeout(() => typing.classList.remove("show"), 800);
      micBtn.disabled = false;
      sendBtn.disabled = false;
      busy = false;
      setFaceMode("idle");
    }

    function stopVoiceSession() {
      hardStop();
    }

    async function listenOnce(signal) {
      const res = await fetch("/hud/listen", {
        method: "POST",
        headers: hudHeaders(),
        body: JSON.stringify({ max_seconds: 11 }),
        signal,
      });
      return await res.json();
    }

    async function startVoice() {
      if (voiceConvo || voiceLoopRunning) {
        // Mic toggle off — must clear voiceLoopRunning or next click stays stuck "off"
        voiceConvo = false;
        listening = false;
        voiceSession += 1;
        voiceLoopRunning = false;
        if (voiceAbort) {
          try { voiceAbort.abort(); } catch (_) {}
          voiceAbort = null;
        }
        cancelServerListen();
        micBtn.classList.remove("is-listening");
        typing.textContent = "VOICE OFF";
        typing.classList.add("show");
        setTimeout(() => typing.classList.remove("show"), 800);
        micBtn.disabled = false;
        sendBtn.disabled = false;
        busy = false;
        setFaceMode("idle");
        return;
      }

      const session = ++voiceSession;
      voiceConvo = true;
      voiceLoopRunning = true;
      busy = true;
      micBtn.classList.add("is-listening");
      micBtn.disabled = false;
      sendBtn.disabled = true;
      addBubble(
        "assistant",
        "Voice chat on — talk naturally. Tap mic again to pause, or Stop to halt."
      );

      let misses = 0;
      try {
        while (voiceConvo && session === voiceSession) {
          listening = true;
          typing.textContent = "LISTENING… SPEAK NATURALLY";
          typing.classList.add("show");
          setFaceMode("listening");

          let transcript = "";
          let data = {};
          const ac = new AbortController();
          voiceAbort = ac;
          try {
            data = await listenOnce(ac.signal);
            transcript = (data.transcript || "").trim();
          } catch (err) {
            if (err && err.name === "AbortError") break;
            if (session !== voiceSession) break;
            addBubble("assistant", "Voice failed — check your HyperX mic in Windows settings.");
            break;
          } finally {
            if (voiceAbort === ac) voiceAbort = null;
            listening = false;
            typing.classList.remove("show");
          }

          if (!voiceConvo || session !== voiceSession) break;
          if (data.reason === "cancelled") break;

          if (!transcript) {
            misses += 1;
            if (data.error) {
              addBubble("assistant", "Mic error: " + data.error);
              break;
            }
            if (misses >= 3) {
              addBubble(
                "assistant",
                "Still not hearing you — check the HyperX mic is selected in Windows, then tap the mic to try again."
              );
              break;
            }
            typing.textContent = "DIDN'T CATCH THAT — TRY AGAIN";
            typing.classList.add("show");
            await new Promise((r) => setTimeout(r, 500));
            typing.classList.remove("show");
            continue;
          }
          misses = 0;
          if (isStopPhrase(transcript)) {
            addBubble("user", transcript);
            addBubble("assistant", "Okay Reyansh — voice chat ended.");
            break;
          }

          const chatAc = new AbortController();
          voiceAbort = chatAc;
          await sendMessage(transcript, {
            fromVoice: true,
            session,
            signal: chatAc.signal,
          });
          if (voiceAbort === chatAc) voiceAbort = null;
          if (!voiceConvo || session !== voiceSession) break;
        }
      } finally {
        if (session === voiceSession) {
          voiceConvo = false;
          listening = false;
          micBtn.classList.remove("is-listening");
          micBtn.disabled = false;
          sendBtn.disabled = false;
          busy = false;
          typing.classList.remove("show");
          setFaceMode("idle");
          voiceLoopRunning = false;
        }
      }
    }

    composer.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(input.value);
      }
    });
    attachBtn.addEventListener("click", () => pickLocalFiles());
    filePick.addEventListener("change", () => uploadPickedFiles(filePick.files));
    const chatPanel = document.querySelector("section.panel.chat");
    if (chatPanel) {
      ["dragenter", "dragover"].forEach((ev) => {
        chatPanel.addEventListener(ev, (e) => {
          e.preventDefault();
          chatPanel.classList.add("drop-target");
        });
      });
      ["dragleave", "drop"].forEach((ev) => {
        chatPanel.addEventListener(ev, () => chatPanel.classList.remove("drop-target"));
      });
      chatPanel.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadPickedFiles(e.dataTransfer && e.dataTransfer.files);
      });
    }
    micBtn.addEventListener("click", () => startVoice());
    stopBtn.addEventListener("click", () => hardStop());
    confirmYes.addEventListener("click", () => decideConfirm("yes"));
    confirmNo.addEventListener("click", () => decideConfirm("no"));

    async function pollBridge() {
      try {
        const res = await fetch("/hud/status", {
          cache: "no-store",
          headers: hudHeaders(),
        });
        const data = await res.json();
        if (typeof data.status === "string" && data.status.startsWith("STREAM ")) {
          typing.textContent = data.status.slice(7) || "STREAMING…";
          typing.classList.add("show");
        }
        if (data.sync) document.getElementById("syncLabel").textContent = data.sync;
        if (data.face && !listening && !awaitingConfirm) setFaceMode(data.face);
        if (typeof data.rag_chunks === "number") {
          const base = awaitingConfirm ? "AWAITING CONFIRM // TERMINAL" : "AGENT // READY";
          backendHint.textContent = `${base} · RAG ${data.rag_chunks}`;
          modelHint.textContent = `RAG ${data.rag_chunks}`;
        }
      } catch (_) {}
    }

    window.addEventListener("load", async () => {
      setTimeout(() => document.getElementById("boot").classList.add("hide"), 700);
      try {
        if (window.Notification && Notification.permission === "default") {
          Notification.requestPermission();
        }
      } catch (_) {}
      tickClock();
      renderCalendar();
      await loadHistory();
      await loadTodos();
      await pollStats();
      await pollEvents();
      input.focus();
      setInterval(pollBridge, 250);
      setInterval(pollStats, 1500);
      setInterval(pollEvents, 3000);
      setInterval(loadTodos, 5000);
      setInterval(tickClock, 1000);
    });
  </script>
</body>
</html>
